name: Gera animação da cobrinha

on:
  schedule:
    - cron: "0 */12 * * *"
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest

    steps:
      - uses: Platane/snk@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-snake.svg?color_snake=%230F2A5F&color_dots=%230B1628,%230F2A5F,%23153670,%231D4E89,%232563B8
            dist/github-snake-dark.svg?color_snake=%230F2A5F&color_dots=%230B1628,%230F2A5F,%23153670,%231D4E89,%232563B8

      - uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}